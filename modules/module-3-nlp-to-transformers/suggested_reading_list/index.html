<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggested reading</title>
<link rel="stylesheet" href="../../../assets/theme.css">
<style>
  body { background:#fff; color:var(--c-ink); font-family:var(--font-body); margin:0; }
  .wrap { max-width:820px; margin:0 auto; padding:40px 24px 72px; }
  .topbar { margin-bottom:20px; font-size:0.9rem; }
  .topbar a { color:var(--c-accent); text-decoration:none; }
  .topbar a:hover { text-decoration:underline; }
  .md h1 { font-size:2rem; border-bottom:2px solid var(--c-line); padding-bottom:.3em; margin:0 0 16px; }
  .md h2 { font-size:1.4rem; border-bottom:1px solid var(--c-line); padding-bottom:.3em; margin:28px 0 14px; }
  .md h3 { font-size:1.15rem; margin:22px 0 10px; }
  .md p, .md li { line-height:1.7; }
  .md a { color:var(--c-accent); text-decoration:none; }
  .md a:hover { text-decoration:underline; }
  .md code { background:var(--c-surface); border-radius:6px; padding:.15em .4em; font-family:var(--font-mono); font-size:0.88em; }
  .md pre { background:#0f172a; color:#e8eefb; border-radius:8px; padding:16px; overflow:auto; }
  .md pre code { background:none; color:inherit; padding:0; }
  .md hr { border:0; border-top:1px solid var(--c-line); margin:28px 0; }
  .md summary { cursor:pointer; color:var(--c-accent); font-weight:600; }
  .md blockquote { border-left:4px solid var(--c-line); margin:0; padding:4px 16px; color:var(--c-ink-soft); }
  .md img { max-width:100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a href="../../../index.html">&larr; Back to the course</a></div>
  <article class="md" id="content">Loading...</article>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  fetch("README.md")
    .then(function (r) { return r.text(); })
    .then(function (md) { document.getElementById("content").innerHTML = marked.parse(md); })
    .catch(function () { document.getElementById("content").textContent = "Could not load README.md"; });
</script>
</body>
</html>
